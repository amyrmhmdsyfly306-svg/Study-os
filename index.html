
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Study OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #101827;
      color: white;
      padding: 20px;
    }
    header { padding: 25px 0; }
    h1 { color: #65d6ad; }
    .card {
      background: #1e2b3d;
      padding: 20px;
      border-radius: 16px;
      margin: 15px 0;
    }
    button {
      background: #65d6ad;
      color: #101827;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Study OS 📚</h1>
    <p>سیستم شخصی مدیریت مطالعه</p>
  </header>

  <div class="card">
    <h2>خوش اومدی امیرمحمد!</h2>
    <p>امروز برای پیشرفت آماده‌ای؟</p>
  </div>

  <div class="card">
    <h3>📖 دفترچه مطالعه</h3>
    <p>فضای اختصاصی یادداشت‌های درسی تو</p>
  </div>

  <div class="card">
    <h3>🎯 برنامه مطالعاتی</h3>
    <p>مدیریت برنامه روزانه و پیگیری مطالعه</p>
  </div>

  <div class="card">
    <h3>📊 پیشرفت تحصیلی</h3>
    <p>به‌زودی آمار مطالعه‌ات اینجا نمایش داده می‌شه.</p>
  </div>
</body>
</html>
